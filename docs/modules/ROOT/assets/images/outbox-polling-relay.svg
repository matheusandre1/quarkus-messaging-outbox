<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520" role="img" font-family="'Inter', 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif">
<title>Quarkus Messaging Outbox with the polling relay</title>
<desc>The business transaction covers the application's entities and the outbox record insert. The polling source claims committed rows in its own transaction, the dispatcher sends them through the connector to the broker, acks come back, and the polling source writes each outcome in its own short transaction.</desc>
