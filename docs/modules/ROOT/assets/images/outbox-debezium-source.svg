<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="680" height="600" role="img" font-family="'Inter', 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif">
<title>Quarkus Messaging Outbox with the Debezium record source</title>
<desc>The business transaction inserts the outbox record. On commit the insert reaches the transaction log, which the embedded Debezium engine reads in commit order. The Debezium source hands records to the dispatcher, which sends them through the connector to the broker; acks come back. The source writes the outcome, delete or park, in its own transaction, and tells the engine when a batch is settled so it can move on.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
