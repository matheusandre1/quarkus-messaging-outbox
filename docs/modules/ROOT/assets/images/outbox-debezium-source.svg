<text x="56" y="52" dominant-baseline="central" font-size="12" fill="#D85A30">Business transaction</text>
<rect x="60" y="64" width="270" height="114" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
