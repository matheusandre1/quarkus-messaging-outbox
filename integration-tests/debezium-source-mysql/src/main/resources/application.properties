quarkus.datasource.db-kind=mysql
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# The outbox channel, relayed from the binlog
mp.messaging.outgoing.cdc-events.connector=smallrye-kafka
mp.messaging.outgoing.cdc-events.topic=cdc-topic
mp.messaging.outgoing.cdc-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.cdc-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.cdc-events.outbox.relay.source=debezium
mp.messaging.outgoing.cdc-events.outbox.ordering=strict
# Debezium reads the binlog as a replica: it needs replication privileges, which the Dev Services user lacks.
# The Dev Services container sets the root password to the datasource password.
mp.messaging.outgoing.cdc-events.outbox.relay.debezium.database.user=root

# Reads the topic back
mp.messaging.incoming.cdc-in.connector=smallrye-kafka
mp.messaging.incoming.cdc-in.topic=cdc-topic
mp.messaging.incoming.cdc-in.auto.offset.reset=earliest
mp.messaging.incoming.cdc-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.cdc-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
