# The test resource provides the datasource, Kafka, and Debezium Kafka Connect.
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# The relay is disabled: Debezium CDC reads the outbox table from the WAL.
mp.messaging.outgoing.cdc-channel.connector=smallrye-kafka
mp.messaging.outgoing.cdc-channel.topic=cdc-topic
mp.messaging.outgoing.cdc-channel.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.cdc-channel.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.cdc-channel.outbox.relay.enabled=false
# The record is deleted in the transaction that writes it: Debezium reads the insert from the WAL, the table stays empty.
mp.messaging.outgoing.cdc-channel.outbox.remove-after-insert=true

# Reads the CDC topic back
mp.messaging.incoming.cdc-in.connector=smallrye-kafka
mp.messaging.incoming.cdc-in.topic=outbox.public.outbox_record
mp.messaging.incoming.cdc-in.auto.offset.reset=earliest
mp.messaging.incoming.cdc-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.cdc-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
