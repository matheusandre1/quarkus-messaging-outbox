# Datasource — Dev Services starts PostgreSQL automatically
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Outbox emitter sends to Kafka — Dev Services starts Kafka automatically
mp.messaging.outgoing.customer-events.connector=smallrye-kafka
mp.messaging.outgoing.customer-events.topic=customer-events

# Consumer reads from the same Kafka topic
mp.messaging.incoming.customer-events-in.connector=smallrye-kafka
mp.messaging.incoming.customer-events-in.topic=customer-events
mp.messaging.incoming.customer-events-in.auto.offset.reset=earliest
